name: Production Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/production-rollback.yml"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Deploy runtime/api files"
        type: boolean
        required: true
        default: true
      web:
        description: "Deploy full web bundle"
        type: boolean
        required: true
        default: true
      marketing_site:
        description: "Deploy marketing root only"
        type: boolean
        required: true
        default: false
      build_api:
        description: "Rebuild api image on VPS"
        type: boolean
        required: true
        default: true
      base_url:
        description: "Smoke-test base URL"
        type: string
        required: false
        default: "https://meritlaunchers.com"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      VM_DIR: /root/merit-launchers
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            marketing/package-lock.json
            server/package-lock.json

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Trust production host
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run regression gate
        run: bash ./deploy/run-local-regression.sh

      - name: Resolve release settings
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            runtime="${{ inputs.runtime }}"
            web="${{ inputs.web }}"
            marketing_site="${{ inputs.marketing_site }}"
            build_api="${{ inputs.build_api }}"
            base_url="${{ inputs.base_url }}"
          else
            runtime="true"
            web="true"
            marketing_site="false"
            build_api="true"
            base_url="https://meritlaunchers.com"
          fi

          release_id="gha-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "marketing_site=$marketing_site" >> "$GITHUB_OUTPUT"
          echo "build_api=$build_api" >> "$GITHUB_OUTPUT"
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Stage release on GitHub runner
        shell: bash
        run: |
          args=(--release-id "${{ steps.release.outputs.release_id }}" --vm-alias "$PROD_SSH_TARGET" --vm-dir "$VM_DIR" --skip-qa)
          if [[ "${{ steps.release.outputs.runtime }}" == "true" ]]; then
            args+=(--runtime)
          fi
          if [[ "${{ steps.release.outputs.web }}" == "true" ]]; then
            args+=(--web)
          fi
          if [[ "${{ steps.release.outputs.marketing_site }}" == "true" ]]; then
            args+=(--marketing-site)
          fi
          if [[ "${{ steps.release.outputs.build_api }}" == "true" ]]; then
            args+=(--build-api)
          fi
          bash ./deploy/stage-vps-release.sh "${args[@]}"

      - name: Apply release on VPS
        shell: bash
        run: |
          ssh "$PROD_SSH_TARGET" \
            "BASE_URL='${{ steps.release.outputs.base_url }}' '$VM_DIR/deploy/vps-deploy-release.sh' --release-id '${{ steps.release.outputs.release_id }}' --base-url '${{ steps.release.outputs.base_url }}'"
