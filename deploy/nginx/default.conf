server {
  listen 80;
  server_name meritlaunchers.com www.meritlaunchers.com;

  location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name meritlaunchers.com www.meritlaunchers.com;

  ssl_certificate     /etc/letsencrypt/live/meritlaunchers.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/meritlaunchers.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 512m;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/admin/paper-sources {
    proxy_pass http://api:8080/v1/admin/paper-sources;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /v1/ {
    proxy_pass http://api:8080/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ref/ {
    proxy_pass http://api:8080/v1/referral/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /toolkit-files/ {
    alias /usr/share/nginx/toolkit-files/;
    add_header Cache-Control "public, max-age=86400";
  }

  location /health {
    proxy_pass http://api:8080/health;
  }

  location = /portal {
    return 302 /portal/;
  }

  location = /admin {
    return 302 /admin/;
  }

  location = /marketing {
    return 302 /marketing/;
  }

  location /portal/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /portal/index.html;
  }

  location /admin/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /admin/index.html;
  }

  location /marketing/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /marketing/index.html;
  }

  # index.html must never be cached — JS/CSS filenames are content-hashed
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Public marketing site. Pages are prerendered to /path.html; unknown URLs get a real 404.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    # One canonical host for marketing pages (API, portal and admin paths are unaffected).
    if ($host = meritlaunchers.com) {
      return 301 https://www.meritlaunchers.com$request_uri;
    }
    try_files $uri $uri.html $uri/ =404;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location = /404.html {
    root /usr/share/nginx/html;
    internal;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Blog posts published after the last build aren't prerendered yet; let the app render them.
  location /blog/ {
    root /usr/share/nginx/html;
    if ($host = meritlaunchers.com) {
      return 301 https://www.meritlaunchers.com$request_uri;
    }
    try_files $uri $uri.html /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Client-side app areas (partner and marketing-admin dashboards, partner join links).
  location ~ ^/(partner|marketing-admin|join)(/|$) {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location ^~ /uploads/ {
    rewrite ^/uploads/(.*)$ /toolkit-files/uploads/$1 permanent;
  }

  # Flutter entry-point files are NOT content-hashed — never cache them
  location ~* /(main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # Vite output under /assets/ is content-hashed, so it can be cached forever.
  location ^~ /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
}
